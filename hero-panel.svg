<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" role="img" aria-label="Illustration of an electrical distribution panel with active circuit connections">
  <defs>
    <linearGradient id="panelFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#152B4A"/>
      <stop offset="1" stop-color="#0B1B31"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E9CFF"/>
      <stop offset="1" stop-color="#1E7FE0"/>
    </linearGradient>
  </defs>

  <!-- cabinet -->
  <rect x="90" y="60" width="380" height="500" rx="10" fill="url(#panelFace)" stroke="#274568" stroke-width="2"/>
  <rect x="90" y="60" width="380" height="60" rx="10" fill="#0E1F38"/>
  <text x="110" y="98" font-family="Poppins, sans-serif" font-size="20" fill="#F2B705" font-weight="600">MAIN DISTRIBUTION</text>

  <!-- breaker rows -->
  <g>
    <!-- row template repeated -->
    <g id="row1">
      <rect x="120" y="150" width="130" height="46" rx="4" fill="#1B3555" stroke="#2E8FF0" stroke-width="1.2"/>
      <rect x="130" y="160" width="14" height="26" rx="2" fill="url(#glow)"/>
      <line x1="160" y1="160" x2="230" y2="160" stroke="#4E6E93" stroke-width="2"/>
      <line x1="160" y1="172" x2="220" y2="172" stroke="#4E6E93" stroke-width="2"/>
      <line x1="160" y1="184" x2="235" y2="184" stroke="#4E6E93" stroke-width="2"/>
    </g>
    <use href="#row1" y="70"/>
    <use href="#row1" y="140"/>
    <use href="#row1" y="210"/>
    <use href="#row1" y="280"/>

    <g id="row2">
      <rect x="310" y="150" width="130" height="46" rx="4" fill="#1B3555" stroke="#2E8FF0" stroke-width="1.2"/>
      <rect x="320" y="160" width="14" height="26" rx="2" fill="url(#glow)"/>
      <line x1="350" y1="160" x2="420" y2="160" stroke="#4E6E93" stroke-width="2"/>
      <line x1="350" y1="172" x2="410" y2="172" stroke="#4E6E93" stroke-width="2"/>
      <line x1="350" y1="184" x2="425" y2="184" stroke="#4E6E93" stroke-width="2"/>
    </g>
    <use href="#row2" y="70"/>
    <use href="#row2" y="140"/>
    <use href="#row2" y="210"/>
    <use href="#row2" y="280"/>
  </g>

  <!-- lower gauge / meter cluster -->
  <circle cx="185" cy="500" r="46" fill="#0E1F38" stroke="#2E8FF0" stroke-width="2"/>
  <path d="M185 500 L210 478" stroke="#F2B705" stroke-width="3" stroke-linecap="round"/>
  <circle cx="185" cy="500" r="5" fill="#F2B705"/>
  <text x="185" y="558" font-family="Inter, sans-serif" font-size="13" fill="#8DA3C0" text-anchor="middle">LOAD</text>

  <circle cx="375" cy="500" r="46" fill="#0E1F38" stroke="#2E8FF0" stroke-width="2"/>
  <path d="M375 500 L352 522" stroke="#3E9CFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="375" cy="500" r="5" fill="#3E9CFF"/>
  <text x="375" y="558" font-family="Inter, sans-serif" font-size="13" fill="#8DA3C0" text-anchor="middle">VOLTAGE</text>

  <!-- external circuit lines flowing off panel -->
  <g fill="none" stroke="#F2B705" stroke-width="2" opacity="0.85">
    <path d="M470 180 H520 V120"/>
    <path d="M470 260 H540"/>
    <path d="M90 340 H40 V400"/>
  </g>
  <g fill="#F2B705">
    <circle cx="520" cy="120" r="5"/>
    <circle cx="540" cy="260" r="5"/>
    <circle cx="40" cy="400" r="5"/>
  </g>
</svg>
